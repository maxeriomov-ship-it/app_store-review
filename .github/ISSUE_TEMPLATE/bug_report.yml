name: Bug report
description: Report a reproducible problem in the skill, scanner, report, or repository tooling.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include private source code, credentials, customer data, signing material, or real App Store Connect exports.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v1.0.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Environment
      options:
        - macOS with Xcode
        - macOS without Xcode
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic or redacted data and include the exact command.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Redacted output
      render: text
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed secrets, personal data, private source, and signing material.
          required: true
