name: Feature request
description: Propose a focused capability or workflow improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe the concrete App Store review workflow or evidence gap.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain inputs, expected output, and safe failure behavior.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Official Apple sources
      description: Add canonical Apple links if the request changes a requirement or compliance check.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: This request does not claim guaranteed App Store approval.
          required: true
        - label: I have not included private project data or credentials.
          required: true
