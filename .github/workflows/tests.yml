name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Validate repository structure
        run: python3 tools/repository_checks.py --mode structure

      - name: Compile Python scripts
        run: python3 -m py_compile app_store_review/scripts/*.py tools/repository_checks.py

      - name: Validate shell syntax
        run: sh -n install.sh update.sh uninstall.sh

      - name: Run all skill self-tests
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/app-store-review-pyc
        run: python3 app_store_review/scripts/run_self_tests.py

      - name: Verify fixtures were not modified
        run: git diff --exit-code -- app_store_review/fixtures
