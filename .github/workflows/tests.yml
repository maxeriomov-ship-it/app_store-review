name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Validate repository structure
        run: python3 tools/repository_checks.py --mode structure

      - name: Compile Python scripts
        run: python3 -m py_compile app_store_review/scripts/*.py tools/repository_checks.py

      - name: Validate shell syntax
        run: sh -n install.sh update.sh uninstall.sh

      - name: Run all skill self-tests
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/app-store-review-pyc
        run: python3 app_store_review/scripts/run_self_tests.py

      - name: Verify fixtures were not modified
        run: git diff --exit-code -- app_store_review/fixtures
